name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fluxocaixa
          POSTGRES_USER: fluxocaixa_user
          POSTGRES_PASSWORD: fluxocaixa_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Rodar testes
        run: ./mvnw test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fluxocaixa
          SPRING_DATASOURCE_USERNAME: fluxocaixa_user
          SPRING_DATASOURCE_PASSWORD: fluxocaixa_pass

      - name: Build do projeto
        run: ./mvnw package -DskipTests